[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cadloop"
version = "0.1.0"
description = "Research scaffold for reproducible CAD harness experiments"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cadloop = "cadloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
